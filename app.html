<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CardControl — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e8f4fd 0%, #f0f7ff 50%, #e8f0fe 100%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 8px 40px rgba(99,102,241,0.10);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .login-logo p {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1e293b;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.10);
      background: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-login:hover  { opacity: 0.92; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .login-error.show { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <span class="logo-icon">💳</span>
      <h1>CardControl</h1>
      <p>Controle de empréstimos de cartão</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="seu usuário" autocomplete="username" required/>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="sua senha" autocomplete="current-password" required/>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <div class="login-footer">CardControl © 2024</div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzexNQ5hoYMnGeNq1mW7FGagysOpPQzCItNTSFuZPNjwxprZonMH_t7ys1KN9eiynGOgQ/exec';

  // Se já tem sessão, vai direto pro app
  if (localStorage.getItem('cardcontrol_session')) {
    window.location.href = 'app.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn   = document.getElementById('btnLogin');
    const error = document.getElementById('loginError');
    const user  = document.getElementById('username').value.trim();
    const pass  = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Entrando...';
    error.classList.remove('show');

    try {
      const params = new URLSearchParams();
      params.append('action', 'login');
      params.append('data', JSON.stringify({ username: user, password: pass }));

      const res  = await fetch(`${API_URL}?${params.toString()}`, {
        method: 'GET', redirect: 'follow'
      });
      const text = await res.text();
      const json = JSON.parse(text);

      if (json.success) {
        localStorage.setItem('cardcontrol_session', JSON.stringify(json.data));
        window.location.href = 'app.html';
      } else {
        error.textContent = json.error || 'Erro ao fazer login.';
        error.classList.add('show');
      }
    } catch(err) {
      error.textContent = 'Erro de conexão. Tente novamente.';
      error.classList.add('show');
    }

    btn.disabled = false;
    btn.textContent = 'Entrar';
  });
</script>

</body>
</html>
